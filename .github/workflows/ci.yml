name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.18.3
                  run_install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            # Baseline debt still exists in the repo, so lint is reported but does not block CI yet.
            - name: Lint
              continue-on-error: true
              run: pnpm lint

            # Baseline debt still exists in the repo, so typecheck is reported but does not block CI yet.
            - name: Typecheck
              continue-on-error: true
              run: pnpm typecheck

            - name: Test
              run: pnpm test
