name: Owner attention

# Agents post to GitHub through the owner's account, and GitHub does not notify
# a user about their own activity. This workflow posts as github-actions[bot] so
# its @mentions reach the owner when a PR waits only on their merge, an issue is
# blocked, a Claude PR needs owner-approved-harness, or Claude's queue runs dry.
# It always runs the trusted script from the default branch, never PR code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]
  issues:
    types: [labeled, unlabeled, closed, reopened]
  workflow_run:
    workflows: [CI, PR template]
    types: [completed]
  schedule:
    # Hourly safety net, 09:20-20:20 Europe/Madrid (UTC+1/+2).
    - cron: '20 7-19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  issues: write
  pull-requests: write

# One repository-wide group: every run's read-before-write dedupe sees the
# previous run's writes, so overlapping events cannot post duplicates. GitHub
# keeps only the newest pending run per group and cancels an older pending one;
# the hourly sweep re-derives ready, harness, blocked and queue notices from
# current state, so a dropped event delays its notice to the next sweep instead
# of losing it.
concurrency:
  group: owner-attention
  cancel-in-progress: false

jobs:
  owner-attention:
    name: owner-attention
    runs-on: ubuntu-latest
    # Skip the bot's own comments, and comments on issues unrelated to the evaluator flow.
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.login != 'github-actions[bot]')

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Notify owner when attention is needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER_LOGIN: ${{ github.repository_owner }}
        run: node scripts/owner-attention.mjs
