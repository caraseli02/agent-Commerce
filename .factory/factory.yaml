# agent-Commerce software factory definition.
#
# This file and .factory/automations/*.md are the source of truth for the
# Claude agents that run on the Mac mini. The scheduler (Claude Desktop local
# routines) only points at these files, so every behavior change goes through a
# reviewed PR to main. See .factory/README.md for machine setup and for the
# rules the Codex heartbeat must follow (Codex is configured outside this repo).
#
# The scheduler cannot read this file: schedule, folder, worktree toggle and
# permission mode are configured once in Claude Desktop to match the values
# below. The routine reads its mode and run window from here on every run.

name: agent-commerce-factory
repository: caraseli02/agent-Commerce
timezone: Europe/Madrid
host: Mac mini only (local routines, no cloud runners)

# Two builder agents share the backlog. Ownership is a GitHub label on the
# issue; it is the only claim record (no feature_list.json or PROGRESS.md edits
# by unattended agents). Each agent keeps WIP=1 inside its own label.
agents:
  claude:
    builds: open issues labeled agent:claude (owner label; set only by Vlad; ready-for-agent not required), plus agent:claude-self issues it opens itself in the improve lane
    branch: claude/issue-<number> # holds the code only
    claim_record: issue labels (in-progress, assignee) + comment + branch claude/issue-<number>, pushed normally; nothing else is pushed
    reviews: ready PRs WITHOUT the agent:claude label (Codex and human PRs, including payments)
  codex:
    builds: ready-for-agent issues without agent:claude, payments first (configured outside this repo)
    reviews: ready PRs WITH the agent:claude label

labels:
  eligible: ready-for-agent # Codex's pool; Claude's is agent:claude alone
  claimed: in-progress
  owner_claude: agent:claude
  self_claude: agent:claude-self # issues Claude opened and claimed itself in the improve lane (claude-improve.md); Claude may set it only there
  owner_codex: agent:codex # optional; issues without agent:claude are Codex's pool
  payments_area: area:payments # normal label ownership applies
  blocked: blocked
  passed: ready-for-human
  never_claim: [epic, blocked, needs-triage, needs-info, ready-for-human, spike] # spike: a question for the night lane, never built
  owner_approved_harness: owner-approved-harness # set or removed only by Vlad, never by an agent (the guard hook blocks it)

# Harness paths remain protected. Vlad may authorize interactive harness work
# with owner-approved-harness; routine repairs may edit already-changed protected
# files on that PR, except .factory/**. Payment paths use normal label ownership,
# payment-contract verification and independent review (owner decision 2026-10-20).
protected_paths:
  factory:
    - .factory/**
    - .claude/**
    - .agents/**
    - .github/**
    - .husky/**
    - docs/agents/**
    - AGENTS.md
    - CLAUDE.md
    - scripts/**
    - PROGRESS.md
    - DECISIONS.md
    - feature_list.json

automations:
  claude-routine:
    file: .factory/automations/claude-routine.md
    role: one run does one thing - morning digest when due, else repair Claude's PR, else review one non-Claude PR, else build one agent:claude issue, else self-start one small improvement, else one night-lane item
    maintenance: .factory/automations/claude-maintenance.md # night lane when nothing is buildable: digest, plan, diagnose, learning, spike, checks; comments and needs-triage issues only, never code
    night_lane:
      budget_minutes: 40 # per run, including install and build
      digest_after: '07:00' # Europe/Madrid; first run at or after it posts the day's digest
      digest_issue_title: Claude morning digest
      plan_ahead: 2 # upcoming agent:claude issues kept with a current plan comment
      spike_label: spike # created by Vlad; only labeled issues with a stated question are spiked
      owned_server_port: 3205 # Codex investigations use 3206
      learnings_inbox_title: 'Learnings inbox: <YYYY>-W<ww>' # weekly issue; Vlad ticks entries and labels it agent:claude to publish to docs/solutions/ (.agents/skills/compound-learning)
    improve:
      file: .factory/automations/claude-improve.md # self-started improvement lane when nothing labeled is buildable
      enabled: true # kill switch; false sends idle runs straight to the night lane
      max_open: 1 # open agent:claude-self claims (with or without PR); a rejected or merged one frees the slot
      max_files: 6 # changed files per improvement, excluding shared_ledger_files
      max_diff_lines: 300 # added + removed lines, excluding shared_ledger_files and snapshots
      areas: [ui-a11y, ux-flow, logic, performance] # rotated: least recently improved first (journal)
      surfaces: [home, catalog-search, product-detail, cart, account-orders, auth, admin-control-panel, dashboard]
      allowed_paths:
        - app/components/**
        - app/pages/**
        - app/layouts/**
        - app/composables/**
        - app/assets/**
        - app/utils/**
        - server/api/**
        - tests/**
      excluded: payment, checkout, Stripe, refund and migration code; dependency changes; new features; brand or legal copy # always, even inside allowed_paths
    mode: build # review-only | build. Build since 2026-10-08, after the rollout acceptance tracked on PR #608
    folder: ~/Documents/agent-Commerce # shared with Codex, which works in the main checkout; Claude runs only in .claude/worktrees/*
    worktree: true # fresh worktree from origin/main per run; .worktreeinclude copies .env.local
    journal: /Users/work/.local/share/agent-commerce/claude/events.jsonl
    schedule: hourly at :00, around the clock # cron "0 * * * *"
    run_window: '00:00-24:00' # always open (Vlad, 2026-10-12); narrow it again to make off-hours runs exit immediately
    run_lock: /Users/work/.local/share/agent-commerce/claude/locks/claude-routine # .factory/bin/run-lock.sh, installed as ~/.local/share/agent-commerce/bin/claude-run-lock; held for the whole run; recovered only when its Claude session has stopped; no age takeover
    guard_hook: .factory/hooks/bash-guard.mjs # installed with the sandbox settings (.factory/settings/routine.settings.local.json) by .factory/bin/install-local.sh, run by Vlad
    budgets:
      actions_per_run: 1
      wip: 1 # exactly one live agent:claude claim; parked (blocked) and queued (open PR with an evaluator PASS, waiting for Vlad's merge) claims do not count; an unblocked claim waits while another is live (autonomous-workflow.md § Claude parking)
      max_pass_queue: 2 # new claims only while fewer queued claims exist; a live claim that passes at the cap still becomes queued
      max_focused_repair_attempts: 2 # consecutive unsuccessful repairs of the same problem; resets after a head passes
      max_reviews_per_run: 1
    # Excluded from the disjoint-file check (claude-routine.md §4.1): every PR of a series edits them and their conflicts are mechanical.
    # pnpm-lock.yaml is deliberately not here (aligned with Codex #682): dependency changes never overlap.
    shared_ledger_files:
      - ui-conventions-baseline.json
      - .visual-impact.json
      - tests/parity/scenarios.ts
      - tests/parity/__snapshots__/**
      - tests/visual/__screenshots__/**

# Builder and reviewer of a PR are always different agents (cross-model review),
# and a reviewer never grades work produced in its own session.
